# main への push と workflow_dispatch で、Android release APK と
# iOS Ad Hoc IPA を Firebase App Distribution へ出す。
#
# matrix.platform = android | ios。fail-fast: false で並列・独立。
#
# Environment app-distribution の secret。リポジトリ secret には置かない。
#   OP_SERVICE_ACCOUNT_TOKEN          vault AppDevelopment を読める 1Password サービスアカウント
#   GCP_WORKLOAD_IDENTITY_PROVIDER    Workload Identity Federation のプロバイダ資源名
#   GCP_SERVICE_ACCOUNT               Firebase App Distribution へ出すサービスアカウント
# リポジトリ変数:
#   FIREBASE_APP_DISTRIBUTION_GROUPS  カンマ区切りのテスターグループ
#
# Android release 署名は 1Password の upload-keystore.jks を使う。
# iOS 署名はフレーバー別アイテムの ios-distribution.p12 /
# ios-distribution-password / ios-adhoc.mobileprovision / ios-team-id を使う。
name: App Distribution

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      flavor:
        description: dart-define のフレーバー
        type: choice
        default: development
        options:
          - development
          - production
      groups:
        description: テスターグループ。空ならリポジトリ変数 FIREBASE_APP_DISTRIBUTION_GROUPS
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: app-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distribute:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: app-distribution
    name: Distribute ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-26
    env:
      FLAVOR: ${{ github.event_name == 'workflow_dispatch' && inputs.flavor || 'development' }}
      DISTRIBUTION_GROUPS: ${{ github.event_name == 'workflow_dispatch' && inputs.groups || vars.FIREBASE_APP_DISTRIBUTION_GROUPS }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Check distribution inputs
        run: |
          set -euo pipefail
          case "${FLAVOR}" in
            development|production) ;;
            *)
              echo "配布できないフレーバーです: ${FLAVOR}"
              exit 1
              ;;
          esac
          if [ -z "${DISTRIBUTION_GROUPS}" ]; then
            echo "テスターグループがありません。リポジトリ変数 FIREBASE_APP_DISTRIBUTION_GROUPS を設定するか、手動起動で groups を指定してください。"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install 1Password CLI
        uses: 1Password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # 1Password/install-cli-action@v4.1.0

      - name: Resolve 1Password item
        id: op_item
        run: |
          set -euo pipefail
          case "${FLAVOR}" in
            production)
              echo "name=CogLog_production" >> "${GITHUB_OUTPUT}"
              echo "bundle_id=io.github.madahataraku.coglog" >> "${GITHUB_OUTPUT}"
              ;;
            development)
              echo "name=CogLog_develop" >> "${GITHUB_OUTPUT}"
              echo "bundle_id=io.github.madahataraku.coglog.debug" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "unsupported flavor: ${FLAVOR}" >&2
              exit 1
              ;;
          esac

      - name: Place google-services.json
        if: ${{ matrix.platform == 'android' }}
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ITEM: ${{ steps.op_item.outputs.name }}
          EXPECTED_PACKAGE: ${{ steps.op_item.outputs.bundle_id }}
        run: |
          set -euo pipefail
          dest_dir="app/android/app/src/${FLAVOR}"
          mkdir -p "${dest_dir}"
          rm -f "${dest_dir}/google-services.json"
          op read --force --out-file "${dest_dir}/google-services.json" \
            "op://AppDevelopment/${OP_ITEM}/google-services.json"
          EXPECTED_PACKAGE="${EXPECTED_PACKAGE}" DEST_DIR="${dest_dir}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ["EXPECTED_PACKAGE"]
          path = Path(os.environ["DEST_DIR"]) / "google-services.json"
          document = json.loads(path.read_text())
          names = [
              client["client_info"]["android_client_info"]["package_name"]
              for client in document["client"]
          ]
          if expected not in names:
              raise SystemExit(
                  "google-services.json package_name mismatch: want %s in %s"
                  % (expected, names)
              )
          PY

      - name: Place release keystore
        if: ${{ matrix.platform == 'android' }}
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p secrets/android
          rm -f secrets/android/upload-keystore.jks app/android/key.properties
          op read --force --out-file secrets/android/upload-keystore.jks \
            "op://AppDevelopment/CogLog_develop/upload-keystore.jks"
          store_password="$(op read 'op://AppDevelopment/CogLog_develop/storePassword')"
          key_password="$(op read 'op://AppDevelopment/CogLog_develop/keyPassword')"
          key_alias="$(op read 'op://AppDevelopment/CogLog_develop/keyAlias')"
          STORE_PASSWORD="$store_password" KEY_PASSWORD="$key_password" KEY_ALIAS="$key_alias" \
            python3 - <<'PY'
          import os
          from pathlib import Path

          def escape(value: str) -> str:
              return (
                  value.replace("\\", "\\\\")
                  .replace("\n", "\\n")
                  .replace("\r", "\\r")
                  .replace("=", "\\=")
                  .replace(":", "\\:")
                  .replace("#", "\\#")
                  .replace("!", "\\!")
              )

          path = Path("app/android/key.properties")
          path.write_text(
              "\n".join(
                  [
                      f"storePassword={escape(os.environ['STORE_PASSWORD'])}",
                      f"keyPassword={escape(os.environ['KEY_PASSWORD'])}",
                      f"keyAlias={escape(os.environ['KEY_ALIAS'])}",
                      "storeFile=../../../secrets/android/upload-keystore.jks",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          path.chmod(0o600)
          PY

      - name: Place iOS Firebase config and signing materials
        if: ${{ matrix.platform == 'ios' }}
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ITEM: ${{ steps.op_item.outputs.name }}
          EXPECTED_BUNDLE_ID: ${{ steps.op_item.outputs.bundle_id }}
        run: |
          set -euo pipefail
          mkdir -p secrets/ios
          rm -f \
            secrets/ios/GoogleService-Info.plist \
            secrets/ios/ios-distribution.p12 \
            secrets/ios/ios-adhoc.mobileprovision \
            secrets/ios/ExportOptions.plist \
            secrets/ios/signing.env
          op read --force --out-file secrets/ios/GoogleService-Info.plist \
            "op://AppDevelopment/${OP_ITEM}/GoogleService-Info.plist"
          op read --force --out-file secrets/ios/ios-distribution.p12 \
            "op://AppDevelopment/${OP_ITEM}/ios-distribution.p12"
          op read --force --out-file secrets/ios/ios-adhoc.mobileprovision \
            "op://AppDevelopment/${OP_ITEM}/ios-adhoc.mobileprovision"
          p12_password="$(op read "op://AppDevelopment/${OP_ITEM}/ios-distribution-password")"
          team_id="$(op read "op://AppDevelopment/${OP_ITEM}/ios-team-id")"
          EXPECTED_BUNDLE_ID="${EXPECTED_BUNDLE_ID}" \
          P12_PASSWORD="${p12_password}" \
          TEAM_ID="${team_id}" \
          FLAVOR="${FLAVOR}" \
            python3 - <<'PY'
          import os
          import plistlib
          import shlex
          import subprocess
          from pathlib import Path

          expected_bundle = os.environ["EXPECTED_BUNDLE_ID"]
          flavor = os.environ["FLAVOR"]
          team_id = os.environ["TEAM_ID"].strip()
          p12_password = os.environ["P12_PASSWORD"]
          if not team_id:
              raise SystemExit("ios-team-id is empty")
          if not p12_password:
              raise SystemExit("ios-distribution-password is empty")

          google_plist_path = Path("secrets/ios/GoogleService-Info.plist")
          with google_plist_path.open("rb") as handle:
              google = plistlib.load(handle)
          bundle_id = google.get("BUNDLE_ID")
          if bundle_id != expected_bundle:
              raise SystemExit(
                  "GoogleService-Info.plist BUNDLE_ID mismatch: want %s got %s"
                  % (expected_bundle, bundle_id)
              )
          if not google.get("GOOGLE_APP_ID"):
              raise SystemExit("GoogleService-Info.plist GOOGLE_APP_ID is missing")

          for configuration in ("Debug", "Profile", "Release"):
              dest_dir = Path("app/ios/Configurations") / f"{configuration}-{flavor}"
              dest_dir.mkdir(parents=True, exist_ok=True)
              dest = dest_dir / "GoogleService-Info.plist"
              dest.write_bytes(google_plist_path.read_bytes())
          runner_plist = Path("app/ios/Runner/GoogleService-Info.plist")
          runner_plist.write_bytes(google_plist_path.read_bytes())

          profile_path = Path("secrets/ios/ios-adhoc.mobileprovision")
          decoded = subprocess.check_output(
              ["security", "cms", "-D", "-i", str(profile_path)],
              stderr=subprocess.DEVNULL,
          )
          profile = plistlib.loads(decoded)
          profile_name = profile.get("Name")
          profile_uuid = profile.get("UUID")
          app_id_prefix = profile.get("ApplicationIdentifierPrefix") or []
          entitlements = profile.get("Entitlements") or {}
          application_identifier = entitlements.get("application-identifier", "")
          if not profile_name or not profile_uuid:
              raise SystemExit("mobileprovision Name/UUID is missing")
          if not application_identifier.endswith("." + expected_bundle):
              raise SystemExit(
                  "mobileprovision bundle mismatch: want suffix .%s got %s"
                  % (expected_bundle, application_identifier)
              )
          profile_teams = set(app_id_prefix) | set(profile.get("TeamIdentifier") or [])
          if profile_teams and team_id not in profile_teams:
              raise SystemExit(
                  "ios-team-id %s does not match profile teams %s"
                  % (team_id, sorted(profile_teams))
              )

          p12_path = Path("secrets/ios/ios-distribution.p12")

          def _p12_leaf_der(password: str) -> bytes:
              last_error = b""
              for extra in ([], ["-legacy"]):
                  try:
                      pem = subprocess.check_output(
                          [
                              "openssl",
                              "pkcs12",
                              "-in",
                              str(p12_path),
                              "-nokeys",
                              "-clcerts",
                              "-passin",
                              "pass:%s" % password,
                              *extra,
                          ],
                          stderr=subprocess.PIPE,
                      )
                  except subprocess.CalledProcessError as exc:
                      last_error = exc.stderr or b""
                      continue
                  if b"BEGIN CERTIFICATE" not in pem:
                      last_error = b"no certificate in p12"
                      continue
                  return subprocess.check_output(
                      ["openssl", "x509", "-outform", "DER"],
                      input=pem,
                  )
              raise SystemExit(
                  "failed to read certificate from ios-distribution.p12: %s"
                  % last_error.decode("utf-8", errors="replace").strip()
              )

          cert_der = _p12_leaf_der(p12_password)
          cert_subject = (
              subprocess.check_output(
                  ["openssl", "x509", "-inform", "DER", "-subject", "-noout"],
                  input=cert_der,
              )
              .decode("utf-8", errors="replace")
              .strip()
          )
          profile_certs = [
              bytes(entry) for entry in (profile.get("DeveloperCertificates") or [])
          ]
          if not any(entry == cert_der for entry in profile_certs):
              raise SystemExit(
                  "ios-distribution.p12 is not included in ios-adhoc.mobileprovision "
                  "(%s). Apple Developer で Ad Hoc プロファイルをこの Distribution "
                  "証明書を選んで作り直し、1Password の ios-adhoc.mobileprovision を"
                  "差し替えるか、プロファイルに含まれる証明書の .p12 に置き換える。"
                  % cert_subject
              )

          profiles_dir = Path.home() / "Library/MobileDevice/Provisioning Profiles"
          profiles_dir.mkdir(parents=True, exist_ok=True)
          installed = profiles_dir / f"{profile_uuid}.mobileprovision"
          installed.write_bytes(profile_path.read_bytes())

          export_options = {
              "destination": "export",
              "method": "ad-hoc",
              "signingStyle": "manual",
              "stripSwiftSymbols": True,
              "provisioningProfiles": {expected_bundle: profile_name},
              "uploadSymbols": False,
              "compileBitcode": False,
              "teamID": team_id,
          }
          with Path("secrets/ios/ExportOptions.plist").open("wb") as handle:
              plistlib.dump(export_options, handle)

          Path("secrets/ios/signing.env").write_text(
              "\n".join(
                  [
                      f"TEAM_ID={shlex.quote(team_id)}",
                      f"PROFILE_NAME={shlex.quote(profile_name)}",
                      f"P12_PASSWORD={shlex.quote(p12_password)}",
                      f"BUNDLE_ID={shlex.quote(expected_bundle)}",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          Path("secrets/ios/signing.env").chmod(0o600)
          PY

      - name: Install iOS signing certificate
        if: ${{ matrix.platform == 'ios' }}
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source secrets/ios/signing.env
          set +a
          KEYCHAIN_PATH="${RUNNER_TEMP}/coglog-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import secrets/ios/ios-distribution.p12 \
            -P "${P12_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"

      - name: Setup Java
        if: ${{ matrix.platform == 'android' }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        if: ${{ matrix.platform == 'android' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache@v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('app/android/**/*.gradle*', 'app/android/**/*.gradle.kts', 'app/android/**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android NDK
        if: ${{ matrix.platform == 'android' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache@v4.3.0
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: ${{ runner.os }}-android-ndk-flutter-3.47.9
          restore-keys: |
            ${{ runner.os }}-android-ndk-

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Generate dart-define
        run: |
          set -euo pipefail
          flutter pub get
          dart run monolith_runner:define

      - name: Accept Android licenses
        if: ${{ matrix.platform == 'android' }}
        run: |
          set +o pipefail
          yes | flutter doctor --android-licenses

      - name: Build release APK
        if: ${{ matrix.platform == 'android' }}
        working-directory: app
        run: |
          set -euo pipefail
          flutter build apk --release --flavor "${FLAVOR}" \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --dart-define-from-file="../secrets/dart-define/${FLAVOR}.json"

      - name: Apply iOS manual signing for CI
        if: ${{ matrix.platform == 'ios' }}
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source secrets/ios/signing.env
          set +a
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          team_id = os.environ["TEAM_ID"]
          profile_name = os.environ["PROFILE_NAME"]
          flavor = os.environ["FLAVOR"]

          for configuration in ("Debug", "Profile", "Release"):
              path = Path("app/ios/Configurations") / f"{configuration}-{flavor}" / "flavor.xcconfig"
              text = path.read_text(encoding="utf-8")
              additions = [
                  "CODE_SIGN_STYLE = Manual",
                  f"DEVELOPMENT_TEAM = {team_id}",
                  f"PROVISIONING_PROFILE_SPECIFIER = {profile_name}",
                  "CODE_SIGN_IDENTITY = iPhone Distribution",
              ]
              if "DEVELOPMENT_TEAM =" not in text:
                  path.write_text(text.rstrip() + "\n" + "\n".join(additions) + "\n", encoding="utf-8")

          pbxproj = Path("app/ios/Runner.xcodeproj/project.pbxproj")
          contents = pbxproj.read_text(encoding="utf-8")
          contents = contents.replace(
              "CODE_SIGN_STYLE = Automatic;",
              "CODE_SIGN_STYLE = Manual;",
          )
          contents = re.sub(
              r'"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";',
              '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Distribution";',
              contents,
          )
          pbxproj.write_text(contents, encoding="utf-8")
          PY

      - name: Build Ad Hoc IPA
        if: ${{ matrix.platform == 'ios' }}
        working-directory: app
        run: |
          set -euo pipefail
          flutter build ipa --release --flavor "${FLAVOR}" \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --dart-define-from-file="../secrets/dart-define/${FLAVOR}.json" \
            --export-options-plist="../secrets/ios/ExportOptions.plist"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.35.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Upload Android APK to Firebase App Distribution
        if: ${{ matrix.platform == 'android' }}
        working-directory: app
        env:
          EXPECTED_PACKAGE: ${{ steps.op_item.outputs.bundle_id }}
        run: |
          set -euo pipefail
          app_id="$(EXPECTED_PACKAGE="${EXPECTED_PACKAGE}" FLAVOR="${FLAVOR}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ["EXPECTED_PACKAGE"]
          path = Path("android/app/src") / os.environ["FLAVOR"] / "google-services.json"
          document = json.loads(path.read_text())
          matches = [
              client["client_info"]["mobilesdk_app_id"]
              for client in document["client"]
              if client["client_info"]["android_client_info"]["package_name"]
              == expected
          ]
          if len(matches) != 1:
              raise SystemExit("Firebase Android app id count is %s" % len(matches))
          print(matches[0])
          PY
          )"
          # --debug で ADC/WIF 失敗の実エラーを出す（login 促し文だけだと原因が隠れる）。
          firebase --non-interactive --debug appdistribution:distribute \
            "build/app/outputs/flutter-apk/app-${FLAVOR}-release.apk" \
            --app "${app_id}" \
            --groups "${DISTRIBUTION_GROUPS}" \
            --release-notes "CogLog ${FLAVOR} android versionCode ${GITHUB_RUN_NUMBER} ${GITHUB_SHA}"

      - name: Upload iOS IPA to Firebase App Distribution
        if: ${{ matrix.platform == 'ios' }}
        working-directory: app
        run: |
          set -euo pipefail
          app_id="$(python3 - <<'PY'
          import plistlib
          from pathlib import Path

          with Path("ios/Runner/GoogleService-Info.plist").open("rb") as handle:
              document = plistlib.load(handle)
          app_id = document.get("GOOGLE_APP_ID")
          if not app_id:
              raise SystemExit("GOOGLE_APP_ID is missing")
          print(app_id)
          PY
          )"
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          if [ "${#ipas[@]}" -ne 1 ]; then
            echo "expected exactly one IPA, found ${#ipas[@]}" >&2
            printf '%s\n' "${ipas[@]:-}" >&2
            exit 1
          fi
          firebase --non-interactive --debug appdistribution:distribute \
            "${ipas[0]}" \
            --app "${app_id}" \
            --groups "${DISTRIBUTION_GROUPS}" \
            --release-notes "CogLog ${FLAVOR} ios build ${GITHUB_RUN_NUMBER} ${GITHUB_SHA}"
