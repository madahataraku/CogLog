name: coglog
description: CogLog records exercise history from stationary bikes and supports weight loss.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.0 <4.0.0"

workspace:
  - app
  - app/runner
  - app_packages/data/database
  - app_packages/data/injection
  - app_packages/data/repository/daily_goal
  - app_packages/data/repository/daily_goal/_impl
  - app_packages/data/repository/daily_goal/_testing
  - app_packages/data/repository/exercise_history
  - app_packages/data/repository/exercise_history/_impl
  - app_packages/data/repository/exercise_history/_testing
  - app_packages/data/repository/top_screen_metric
  - app_packages/data/repository/top_screen_metric/_impl
  - app_packages/data/repository/top_screen_metric/_testing
  - app_packages/domain/daily_goal
  - app_packages/domain/exercise_history
  - app_packages/foundation/metadata
  - app_packages/foundation/resources
  - app_packages/infra/app_settings
  - app_packages/infra/app_settings/_mobile
  - app_packages/infra/app_settings/_testing
  - app_packages/infra/health_workout
  - app_packages/infra/health_workout/_mobile
  - app_packages/infra/health_workout/_testing
  - app_packages/infra/injection
  - app_packages/infra/meter_photo
  - app_packages/infra/meter_photo/_mobile
  - app_packages/infra/meter_photo/_testing
  - app_packages/infra/meter_reading
  - app_packages/infra/meter_reading/_mobile
  - app_packages/infra/meter_reading/_testing
  - app_packages/infra/on_device_llm
  - app_packages/infra/on_device_llm/_mobile
  - app_packages/infra/on_device_llm/_testing
  - app_packages/screen/feature/exercise_history
  - app_packages/screen/feature/goal_settings
  - app_packages/screen/feature/main
  - app_packages/screen/feature/meter_capture
  - app_packages/screen/feature/top
  - app_packages/screen/injection
  - app_packages/screen/navigation
  - app_packages/screen/navigation/_go_router
  - app_packages/usecase/generate_top_advice
  - app_packages/usecase/generate_top_advice/_impl
  - app_packages/usecase/injection
  - app_packages/usecase/load_daily_goal
  - app_packages/usecase/load_daily_goal/_impl
  - app_packages/usecase/load_exercise_history_detail
  - app_packages/usecase/load_exercise_history_detail/_impl
  - app_packages/usecase/load_exercise_history_page
  - app_packages/usecase/load_exercise_history_page/_impl
  - app_packages/usecase/load_top_screen
  - app_packages/usecase/load_top_screen/_impl
  - app_packages/usecase/save_daily_goal
  - app_packages/usecase/save_daily_goal/_impl
  - app_packages/usecase/save_top_screen_metric
  - app_packages/usecase/save_top_screen_metric/_impl
  - app_packages/screen/feature/exercise_history_detail


# 実効バージョンはここで揃える。子パッケージの依存は any。
dependency_overrides:
  app_settings: 6.1.1
  build_runner: 2.10.4
  drift: 2.30.0
  drift_dev: 2.30.0
  flutter_hooks: 0.21.3+1
  flutter_lints: ^6.0.0
  flutter_riverpod: 3.4.3
  forui: ^0.27.7
  go_router: 18.1.3
  hooks_riverpod: 3.4.3
  image_picker: 1.2.0
  monolith_localization_runtime: ^1.1.0
  monolith_runner: ^1.0.2
  path: 1.9.1
  path_provider: 2.1.5
  riverpod: 3.4.3
  shared_preferences: 2.5.6
  sqlite3: 2.9.4
  sqlite3_flutter_libs: 0.5.40
  state_stream: 1.0.2
  state_stream_riverpod: 2.0.1
  uuid: 4.5.2

dev_dependencies:
  flutter_lints: any
  monolith_runner: any
