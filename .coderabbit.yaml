# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CogLog 向け CodeRabbit 設定の草案。
# このファイルはリポジトリのルートに置く。レビュー対象ブランチにある内容が、そのプルリクエストに使われる。
# 自動レビューを開始するには、別途 CodeRabbit の GitHub App をこのリポジトリへインストールする。
# ここに無い項目は schema のデフォルトになる。組織設定や UI 設定とは、inheritance を有効にしない限りマージされない。

language: ja-JP
early_access: false
enable_free_tier: true
tone_instructions: 簡潔に、根拠を添えて指摘する。体裁より、記録の欠落、計算ミス、個人の運動・体重データの扱いを優先する。

reviews:
  profile: chill
  high_level_summary: true
  high_level_summary_in_walkthrough: false
  high_level_summary_instructions: |
    変更の目的、利用者への影響、既存の運動記録と体重記録との互換性を箇条書きでまとめる。
  poem: false
  in_progress_fortune: false
  review_status: true
  review_details: false
  collapse_walkthrough: true
  enable_prompt_for_ai_agents: true
  # 指摘が解消され、最新コミットのレビューと事前チェックを通過すると approve する。マージはしない。
  # request_changes_workflow は auto_approvals.enabled の別名。両方を違う値にすると承認が無効になる。
  auto_approvals:
    enabled: true
  auto_review:
    # main はデフォルトブランチのため常に対象。base_branches はそれ以外を追加する。
    enabled: true
    auto_incremental_review: true
    # レビュー済みコミットがこの数に達すると自動レビューを止める。0 で無効。頻繁な push では 1 か 2 に下げる。
    auto_pause_after_reviewed_commits: 5
    # ドラフトは対象外。作業中から見てほしい場合だけ true にする。
    drafts: false
    base_branches: []
    labels:
      - "!wip"
    ignore_title_keywords:
      - WIP
      - DO NOT MERGE
      - "[skip review]"
    ignore_usernames:
      - dependabot[bot]
      - renovate[bot]
      - github-actions[bot]
  # 除外だけを書く。! の付かないパターンはレビュー対象をそのパターンだけに狭める。
  path_filters:
    - "!**/*.g.dart"
    - "!**/*.freezed.dart"
    - "!**/*.mocks.dart"
    - "!**/*.gr.dart"
    - "!**/generated_plugin_registrant.dart"
    - "!**/GeneratedPluginRegistrant.*"
    - "!**/.dart_tool/**"
    - "!**/build/**"
    - "!**/coverage/**"
    - "!**/.gradle/**"
    - "!**/Pods/**"
    - "!**/ephemeral/**"
    - "!**/*.iml"
    - "!apm_modules/**"
    - "!apm.lock.yaml"
  path_instructions:
    - path: "lib/**/*.dart"
      instructions: |
        CogLog はエアロバイクの運動履歴と減量を記録する Flutter アプリ。
        運動セッションと体重記録が欠落、重複、黙って上書きされないかを見る。
        時刻は利用者のローカル日付で揃っているか、単位は kg、kcal、分、km で揃っているかを確認する。
        保存形式を変えるときは、既存データの移行と失敗時の扱いがあるかを見る。
        個人の測定値や端末識別子をログ、例外メッセージ、解析イベントへ出さない。
        ウィジェットの見た目だけの好みは指摘しない。
    - path: "test/**/*.dart"
      instructions: |
        flutter_test のテストとして読む。
        カロリー、距離、時間、体重差分は 0、境界値、通常値を含める。
        記録が空のときと、日付をまたぐセッションを含める。
        センサー、Bluetooth、ファイルシステムはフェイクし、実機に依存しない。
    - path: "integration_test/**/*.dart"
      instructions: |
        記録の追加、一覧、再起動後の復元など、利用者が通る流れを確認する。
        実機のバイクやネットワークが無いと落ちるテストにしない。
    - path: "android/**"
      instructions: |
        権限はバイク接続やヘルスコネクトなど、機能に必要なものだけにする。
        keystore、key.properties、API キー、署名パスワードをリポジトリへ置かない。
        生成された Gradle やプラグイン登録コードの体裁は指摘しない。
    - path: "ios/**"
      instructions: |
        権限の利用目的は、運動記録に必要な機能と一致させる。
        署名設定、プロビジョニングプロファイル、API キーをコミットしない。
        Pods や ephemeral 配下の生成物は指摘しない。
    - path: "pubspec.yaml"
      instructions: |
        追加する依存関係が運動記録か減量記録に必要かを確認する。
        SDK 制約を不必要に狭めたり、未使用の依存を増やしたりしない。
    - path: ".github/**"
      instructions: |
        Flutter の解析とテストを実行するワークフローになっているかを見る。
        シークレットをログへ出さない。pull_request_target でフォークのコードを信頼しない。
  pre_merge_checks:
    title:
      mode: warning
      requirements: |
        タイトルは変更内容が分かる1文にする。WIP、仮、テストだけのタイトルは避ける。
    # ネイティブ移植コードなど、docstring 網羅は要求しない。
    docstrings:
      mode: off
    custom_checks:
      - name: 運動記録の保全
        mode: warning
        instructions: |
          個人の測定値をログへ出す、またはシークレット、トークン、keystore をリポジトリへ追加する場合は、プルリクエスト本文の説明に関係なく fail。
          既存の運動履歴または体重履歴を削除するか、黙って上書きする場合、または保存済みの値を変換せずに単位を変更する場合は、プルリクエスト本文で既存データの扱いを説明していなければ fail。
          上記に該当しない変更は pass。
  tools:
    gitleaks:
      enabled: true
    github-checks:
      enabled: true
    actionlint:
      enabled: true
    swiftlint:
      enabled: true
    detekt:
      enabled: true

chat:
  auto_reply: true

code_generation:
  docstrings:
    language: ja-JP
    path_instructions:
      - path: "lib/**/*.dart"
        instructions: |
          公開 API には dartdoc を付ける。
          運動セッションと体重記録の単位、保存形式、時刻の扱いを書く。
          build メソッドなど自明なウィジェット実装には説明を付けない。
  unit_tests:
    path_instructions:
      - path: "lib/**/*.dart"
        instructions: |
          flutter_test を使う。
          カロリー、距離、時間、体重差分の計算は境界値を含める。
          記録が空のときと、日付をまたぐセッションを含める。
          ネットワークや端末センサーはフェイクする。
