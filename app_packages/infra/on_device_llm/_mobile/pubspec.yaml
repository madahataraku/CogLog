name: infra_on_device_llm_mobile
description: Mobile on-device LLM backed by OS models (Gemini Nano / Foundation Models).
publish_to: none
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  foundation_app_log: any
  infra_on_device_llm: any
  meta: any

dev_dependencies:
  flutter_lints: any
  flutter_test:
    sdk: flutter
  test: any

flutter:
  plugin:
    platforms:
      android:
        package: io.github.madahataraku.coglog.on_device_llm
        pluginClass: OnDeviceLlmPlugin
      ios:
        pluginClass: OnDeviceLlmPlugin
