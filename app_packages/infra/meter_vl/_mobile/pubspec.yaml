name: infra_meter_vl_mobile
description: Mobile MeterVlVision (Android / iOS LiteRT-LM).
publish_to: none
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  infra_meter_vl: any
  meta: any

dev_dependencies:
  flutter_lints: any
  flutter_test:
    sdk: flutter
  test: any

flutter:
  plugin:
    platforms:
      android:
        package: io.github.madahataraku.coglog.meter_vl
        pluginClass: MeterVlPlugin
      ios:
        pluginClass: MeterVlPlugin
